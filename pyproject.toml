[project]
name = "comfyui-qwenimagerefpack"
description = "Two-image reference manager for MiniMax H3 I2VA and FL2VA."
version = "0.1.0"
license = { file = "LICENSE" }
requires-python = ">=3.10"

[project.urls]
Repository = "https://github.com/Hearmeman24/ComfyUI-QwenImageRefPack"

[tool.comfy]
PublisherId = "hearmeman24"
DisplayName = "Qwen Image References Manager"
Icon = ""

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--import-mode=importlib"
